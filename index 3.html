<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#fff0f5}
.screen{min-height:100vh;position:relative;overflow:hidden}
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,#fffafd,#ffe9f1)}
.intro h1{font-size:clamp(32px,8vw,58px);margin:0 0 35px;color:#ad4267}
.enter{border:0;border-radius:999px;padding:15px 30px;background:#d65d85;color:white;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px #b94d702d}
.night{background:radial-gradient(circle at 50% 15%,#273963 0,#111b3b 40%,#050b1d 100%);cursor:pointer;touch-action:manipulation}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:83px 71px,137px 113px;background-position:12px 9px,45px 33px;opacity:.65}
.moon{position:absolute;width:70px;height:70px;border-radius:50%;right:28px;top:25px;background:#fff7d1;box-shadow:0 0 30px #fff7d177}
.hint{position:absolute;top:18px;left:15px;right:15px;text-align:center;color:#ffffffc7;font-size:14px;pointer-events:none}
.flower{position:absolute;pointer-events:none;transform:translate(-50%,-100%);animation:fade 1.15s ease-out forwards}
.stem{width:4px;height:75px;background:#699b62;border-radius:5px;margin:auto}
.bloom{position:absolute;left:50%;top:-7px;transform:translate(-50%,-50%);width:43px;height:43px;border-radius:50%;background:radial-gradient(circle,#ffdbe4 0 17%,#e85c85 18% 45%,#b52d5b 46%);box-shadow:0 0 17px #ff719766;animation:bloom .4s ease-out}
.word{position:absolute;left:50%;top:-65px;transform:translateX(-50%);white-space:nowrap;color:white;font-size:19px;font-weight:800;text-shadow:0 2px 8px #000;animation:pop .45s ease-out}
.burst{position:absolute;left:50%;top:-62px;width:10px;height:10px;border-radius:50%;box-shadow:0 -35px #ffd0dc,25px -25px #ff91b0,35px 0 #fff,25px 25px #ffb1c6,0 35px #ffd0dc,-25px 25px #ff91b0,-35px 0 #fff,-25px -25px #ffb1c6;animation:burst .7s ease-out forwards}
.floating{position:absolute;bottom:-55px;font-size:28px;pointer-events:none;animation:floatUp linear forwards;opacity:.9}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}10%{opacity:.9}50%{transform:translateY(-50vh) translateX(var(--drift)) rotate(12deg)}100%{transform:translateY(-115vh) translateX(calc(var(--drift) * -1)) rotate(-18deg);opacity:0}}
@keyframes bloom{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.floating{animation:none;opacity:.5}.flower{animation:none}.burst{animation:none}}
</style>
</head>
<body>
<section class="screen intro" id="intro">
  <h1>أعتذر على ما حدث أمس</h1>
  <button class="enter" id="enter">اضغطي هنا</button>
</section>

<section class="screen night" id="night" hidden>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="hint">اضغطي في أي مكان ✨</div>
</section>

<script>
const intro=document.getElementById("intro");
const night=document.getElementById("night");
const enter=document.getElementById("enter");
const words=["لامورتي","حبي","عمري","حياتي","قلبي"];
let index=0;

enter.addEventListener("click",()=>{
  intro.hidden=true;
  night.hidden=false;
  startFloating();
});

function startFloating(){
  setInterval(()=>{
    const el=document.createElement("div");
    el.className="floating";
    el.textContent=Math.random()<0.68?"🌹":"💋";
    el.style.left=(Math.random()*100)+"%";
    el.style.setProperty("--drift",(Math.random()*120-60)+"px");
    el.style.animationDuration=(5+Math.random()*5)+"s";
    el.style.fontSize=(22+Math.random()*16)+"px";
    night.appendChild(el);
    setTimeout(()=>el.remove(),11000);
  },650);
}

night.addEventListener("pointerdown",(e)=>{
  if(e.target.closest(".moon")||e.target.closest(".hint")) return;
  const rect=night.getBoundingClientRect();
  const f=document.createElement("div");
  f.className="flower";
  f.style.left=(e.clientX-rect.left)+"px";
  f.style.top=(e.clientY-rect.top)+"px";
  f.innerHTML=`<div class="word">${words[index++%words.length]}</div><div class="burst"></div><div class="bloom"></div><div class="stem"></div>`;
  night.appendChild(f);
  setTimeout(()=>f.remove(),1200);
});
</script>
</body>
</html>
